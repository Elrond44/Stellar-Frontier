  canvas{display:block;width:100%;height:100%;touch-action:manipulation}

  #cls{position:absolute;inset:0;pointer-events:none}
  #lead{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}

  .lbl b{display:block;color:#fff;font-size:var(--fs1,12px)}.lbl i{display:block;font-style:normal;color:#8fb4dd;font-size:var(--fs2,10px)}
  .lbl.cat{white-space:normal;overflow:hidden}
  #card{position:fixed;left:50%;bottom:12px;transform:translateX(-50%);width:min(92vw,360px);box-sizing:border-box;padding:12px 14px;border-radius:12px;background:rgba(8,18,34,.94);border:1px solid #2f5d93;box-shadow:0 6px 24px #000a;display:none;z-index:5;cursor:pointer}

  #hint{position:absolute;right:10px;bottom:8px;color:#5f84b0;font-size:11px;pointer-events:none}
</style>

  box.innerHTML = HULL_IDS.map((id, i) => { const H = HULLS[id]; const c = i % G.cols, r = Math.floor(i / G.cols); const lh = sm ? 30 : 36; return `<div class="lbl cat" data-id="${id}" style="width:${Math.floor(G.cw - 6)}px;height:${lh - 2}px;transform:translate(${Math.round(c * G.cw + 3)}px,${Math.round(G.top + (r + 1) * G.ch - lh)}px)"><b>${H.name}</b><i>${fmt(H.len * UNIT_M)} m${sm ? '' : ' · ' + H.role}</i></div>`; }).join(''); }
function renderNow() { if (mode === 'catalog') renderCatalog(); else R.render(scene, camera); }
function resize() { const w = innerWidth, h = innerHeight; R.setSize(w, h, false); camera.aspect = w / h; camera.updateProjectionMatrix(); layout(); if (mode === 'catalog') catLabels(); }
let rt = 0; addEventListener('resize', () => { clearTimeout(rt); rt = setTimeout(resize, 60); }); resize();
// labels are laid out once per resize (the hulls do not move); the frame loop only animates engines and nav lights
let t = 0; function frame() { t += 1 / 60; for (const s of ships) { s.fl.mat.uniforms.uTime.value = t; animateNavLights(s.g, t); } renderNow(); window.READY = true; if (!q.get('still')) requestAnimationFrame(frame); }
frame();
</script>
